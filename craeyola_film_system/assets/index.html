<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CROYOLA | Multimedia Pipeline</title>

    <link rel="stylesheet" href="index.css">

</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <div class="brand">
    <img src="creoyola.png" 
    alt="CROYOLA Logo">
</div>

            <h1>
                Welcome To Craeyola
            </h1>

            <p class="muted">
                Select your account type
            </p>


            <div class="role-choice">

                <!-- PROJECT MANAGER -->

                <a
                    href="login-admin.html"
                    class="choice"
                >

                    <span>👨‍💼</span>

                    <div>
                        <b>Project Manager</b>

                        <small>
                            Administrative workspace
                        </small>
                    </div>

                </a>


                <!-- TEAM / CLIENT -->

                <a
                    href="login-user.html"
                    class="choice"
                >

                    <span>🎨</span>

                    <div>
                        <b>Team / Client</b>

                        <small>
                            Client, Artist, Scriptwriter, Animator
                        </small>
                    </div>

                </a>

            </div>

        </div>

    </main>


    <script src="./index.js"></script>

</body>

</html>
