<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        CROYOLA | Project Manager
    </title>

    <link rel="stylesheet"
          href="login-admin.css">

</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <a href="index.html" class="back">
                ← Back
            </a>

                <div class="brand">
    <img src="creoyola.png" 
    alt="CROYOLA Logo">
</div>

            <h1>
                Project Manager
            </h1>

            <p class="muted">
                Administrative access to the
                multimedia production pipeline.
            </p>

            <form id="adminLoginForm">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="adminEmail"
                    placeholder="manager@croyola.com"
                    required
                >

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">
                    Log In as Project Manager
                </button>

                <p
                    id="adminMessage"
                    class="message">
                </p>

            </form>


             <p class="switch">

                Don't have an account?

                <a href="signup-admin.html">
                    Create Account
                </a>

            </p>
        </div>

    </main>

    <script src="login-admin.js"></script>

</body>

</html>
