<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CROYOLA | Admin Sign Up</title>

    <link rel="stylesheet" href="signup-admin.css">

</head>

<body>

    <main class="signup-page">

        <div class="signup-card">

            <!-- BRAND -->

            <div class="brand">
             <img src="logo (2).png" alt="CROYOLA">
            </div>


            <!-- TITLE -->

            <h1>
                Create Project Manager Account
            </h1>

            <p class="muted">
                Register your administrative account
            </p>


            <!-- SIGN UP FORM -->

            <form id="adminSignupForm">

                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="adminName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="adminName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="adminEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="adminConfirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="adminConfirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- MESSAGE -->

                <p
                    id="signupMessage"
                    class="signup-message"
                ></p>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="signup-button"
                >
                    Create Admin Account
                </button>

            </form>


            <!-- LOGIN LINK -->

            <p class="login-text">

                Already have an account?

                <a href="login-admin.html">
                    Log in
                </a>

            </p>


            <!-- BACK -->

            <a
                href="index.html"
                class="back-link"
            >
                ← Back to account selection
            </a>

        </div>

    </main>


    <script src="signup-admin.js"></script>

</body>

</html>
