<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        CROYOLA | Create Account
    </title>

    <link rel="stylesheet"
          href="signup-user.css">

</head>

<body>

    <main class="signup-page">

        <div class="signup-card">

            <a href="login-user.html"
               class="back">
                ← Back to Login
            </a>

            <div class="brand">
            <img src="logo (2).png">
            </div>

            <h1>
                Create Account
            </h1>

            <p class="muted">
                Join the multimedia production pipeline.
            </p>

            <form id="signupForm">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="name@example.com"
                    required
                >

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >

                <label>
                    Role
                </label>

                <select id="role" required>

                    <option value="">
                        Select your role
                    </option>

                    <option value="client">
                        Client
                    </option>

                    <option value="artist">
                        Artist
                    </option>

                    <option value="scriptwriter">
                        Scriptwriter
                    </option>

                    <option value="animator">
                        Animator
                    </option>

                </select>

                <button type="submit">
                    Create Account
                </button>

                <p id="signupMessage"
                   class="message">
                </p>

            </form>

        </div>

    </main>

    <script src="signup-user.js"></script>

</body>

</html>
